name: Release Zapdrop for Windows

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      release_tag:
        description: "Existing or new release tag, for example v0.1.0"
        required: true
        type: string

permissions:
  contents: write

env:
  NODE_VERSION: "22"
  PNPM_VERSION: "10.4.1"
  APP_DIR: apps/zapdrop-desktop
  TAURI_DIR: apps/zapdrop-desktop/src-tauri

jobs:
  windows-release:
    name: Build Windows executable and installer
    runs-on: windows-latest

    steps:
      - name: Check out Zapdrop
        uses: actions/checkout@v4

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: ${{ env.PNPM_VERSION }}

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-msvc

      - name: Install frontend dependencies
        run: pnpm install --frozen-lockfile

      - name: Build the frontend
        run: pnpm --dir $env:APP_DIR build

      - name: Build the Windows application and NSIS installer
        run: pnpm --dir $env:APP_DIR tauri build --bundles nsis

      - name: Stage release files
        shell: pwsh
        run: |
          $version = (Get-Content "$env:TAURI_DIR/tauri.conf.json" | ConvertFrom-Json).version
          $releaseTag = "${{ inputs.release_tag }}"
          if ([string]::IsNullOrWhiteSpace($releaseTag)) {
            $releaseTag = "${{ github.ref_name }}"
          }
          $stage = "release-staging"
          New-Item -ItemType Directory -Force -Path $stage | Out-Null

          $portable = "$stage/Zapdrop-$version-windows-x64-portable.exe"
          Copy-Item "$env:TAURI_DIR/target/release/zapdrop.exe" $portable

          $installer = Get-ChildItem "$env:TAURI_DIR/target/release/bundle/nsis" -Filter "*.exe" | Select-Object -First 1
          if ($null -eq $installer) {
            throw "The NSIS installer was not generated."
          }
          Copy-Item $installer.FullName "$stage/Zapdrop-$version-windows-x64-installer.exe"

          "RELEASE_TAG=$releaseTag" | Out-File -FilePath "$stage/release.env" -Encoding utf8
          Get-ChildItem $stage | Format-Table Name, Length

      - name: Upload Windows files as workflow artifacts
        uses: actions/upload-artifact@v4
        with:
          name: zapdrop-windows-${{ github.run_number }}
          path: release-staging/*.exe
          if-no-files-found: error
          retention-days: 30

      - name: Publish the GitHub release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ inputs.release_tag || github.ref_name }}
          name: Zapdrop ${{ inputs.release_tag || github.ref_name }}
          generate_release_notes: true
          files: release-staging/*.exe
          fail_on_unmatched_files: true


  windows-smoke-test:
    name: Launch Windows executable and capture screenshot
    needs: windows-release
    runs-on: windows-latest

    steps:
      - name: Download the Windows release artifact
        uses: actions/download-artifact@v4
        with:
          name: zapdrop-windows-${{ github.run_number }}
          path: smoke-artifact

      - name: Launch Zapdrop and capture the desktop
        shell: pwsh
        run: |
          Add-Type -AssemblyName System.Windows.Forms
          Add-Type -AssemblyName System.Drawing

          $portable = Get-ChildItem "smoke-artifact" -Recurse -Filter "*portable.exe" | Select-Object -First 1
          if ($null -eq $portable) {
            throw "The portable Zapdrop executable was not found in the downloaded artifact."
          }

          $process = Start-Process -FilePath $portable.FullName -WorkingDirectory $portable.DirectoryName -PassThru
          try {
            Start-Sleep -Seconds 12
            if ($process.HasExited) {
              throw "Zapdrop exited before the smoke-test screenshot could be captured (exit code $($process.ExitCode))."
            }

            $screen = [System.Windows.Forms.Screen]::PrimaryScreen.Bounds
            $bitmap = New-Object System.Drawing.Bitmap($screen.Width, $screen.Height)
            $graphics = [System.Drawing.Graphics]::FromImage($bitmap)
            try {
              $graphics.CopyFromScreen($screen.Location, [System.Drawing.Point]::Empty, $screen.Size)
              $bitmap.Save("zapdrop-smoke-screenshot.png", [System.Drawing.Imaging.ImageFormat]::Png)
            }
            finally {
              $graphics.Dispose()
              $bitmap.Dispose()
            }
          }
          finally {
            if (-not $process.HasExited) {
              Stop-Process -Id $process.Id -Force -ErrorAction SilentlyContinue
            }
          }

      - name: Upload the smoke-test screenshot
        uses: actions/upload-artifact@v4
        with:
          name: zapdrop-windows-smoke-screenshot-${{ github.run_number }}
          path: zapdrop-smoke-screenshot.png
          if-no-files-found: error
          retention-days: 30


  bidirectional-transfer-test:
    name: Concurrent bidirectional transfer test
    needs: windows-release
    runs-on: ubuntu-24.04

    steps:
      - name: Install Linux build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf libssl-dev

      - name: Check out Zapdrop
        uses: actions/checkout@v4

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: ${{ env.PNPM_VERSION }}

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Install frontend dependencies
        run: pnpm install --frozen-lockfile

      - name: Build the frontend test payload
        run: pnpm --dir "$APP_DIR" build

      - name: Run simultaneous A-to-B and B-to-A transfer test
        run: cargo test --manifest-path "$TAURI_DIR/Cargo.toml" --lib transfer::tests::bidirectional_concurrent_loopback_transfer -- --nocapture

      - name: Run feature-gated encrypted v2 verification suite
        run: cargo test --manifest-path "$TAURI_DIR/Cargo.toml" --features swarm-v2 --lib
