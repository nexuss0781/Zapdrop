[package]
name = "zapdrop"
version = "0.1.0"
description = "Offline local-network file sharing for nearby PCs"
authors = ["Nexuss"]
edition = "2021"
rust-version = "1.77.2"
license = "MIT"

[lib]
name = "zapdrop_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
base64 = "0.22"
directories = "6"
ed25519-dalek = "2"
keyring = "3"
local-ip-address = "0.6"
mdns-sd = "0.21"
rand_core = { version = "0.6", features = ["getrandom"] }
thiserror = "2"
tokio = { version = "1", features = ["net", "time", "sync", "rt-multi-thread"] }
uuid = { version = "1", features = ["v4", "serde"] }

[features]
default = ["custom-protocol"]
custom-protocol = ["tauri/custom-protocol"]
