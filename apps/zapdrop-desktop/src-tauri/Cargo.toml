[package]
name = "zapdrop"
version = "0.1.0"
description = "Offline local-network file sharing for nearby PCs"
authors = ["Nexuss"]
edition = "2021"
rust-version = "1.77.2"
license = "MIT"

[lib]
name = "zapdrop_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[features]
default = ["custom-protocol"]
custom-protocol = ["tauri/custom-protocol"]
